name: Build Windows

on:
  push:
  workflow_dispatch:
    inputs:
      worst_conditions:
        description: 'تشغيل فحص التعرف في أسوأ الظروف (حوالي 35 دقيقة)'
        type: boolean
        default: true

env:
  OPENCV_VERSION: '4.10.0'
  APP_VERSION: 3.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          # صوت الفيديو
          modules: 'qtmultimedia'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-${{ env.OPENCV_VERSION }}-windows

      - name: Install OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe"
          Invoke-WebRequest $url -OutFile opencv.exe
          Start-Process .\opencv.exe -ArgumentList '-oC:\opencv', '-y' -Wait
          Get-ChildItem C:\opencv\opencv\build\x64
        shell: pwsh

      - name: Cache models and ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEPS_DIR="${{ github.workspace }}/.deps-cache" -DOpenCV_DIR=C:/opencv/opencv/build/x64/vc16/lib -DMALAMIH_VERSION="$env:APP_VERSION"

      - name: Build
        run: cmake --build build

      - name: Deploy
        run: |
          New-Item -ItemType Directory dist\Malamih | Out-Null
          Copy-Item build\Malamih.exe, build\*.dll dist\Malamih\
          Copy-Item build\models dist\Malamih\models -Recurse
          windeployqt --release --no-translations --no-compiler-runtime dist\Malamih\Malamih.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "MSVC runtime not found under $env:VCToolsRedistDir" }
          Copy-Item "$($crt.FullName)\*.dll" dist\Malamih\
          # نسخة DirectML من ONNX Runtime (تحليل على كرت الشاشة)؛ غيابها يعني أن البناء رجع لنسخة المعالج
          if (-not (Test-Path dist\Malamih\DirectML.dll)) { throw "DirectML.dll missing: the GPU build of ONNX Runtime was not used" }
          Get-ChildItem dist\Malamih
        shell: pwsh

      - name: Recognition test
        run: |
          $base = "https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples"
          New-Item -ItemType Directory testdata | Out-Null
          foreach ($name in 'obama.jpg', 'obama2.jpg', 'biden.jpg') { Invoke-WebRequest "$base/$name" -OutFile "testdata\$name" }

          function Compare-Faces($first, $second) {
            $out = Join-Path $PWD "result.txt"
            $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--self-test', $first, $second, $out -Wait -PassThru
            $text = Get-Content $out -Raw
            Write-Host "$first vs $second (exit $($p.ExitCode)):`n$text"
            if ($p.ExitCode -ne 0) { throw "Self-test failed" }
            return [double](($text | Select-String 'best_similarity=([-\d.]+)').Matches[0].Groups[1].Value)
          }

          $same = Compare-Faces testdata\obama.jpg testdata\obama2.jpg
          $different = Compare-Faces testdata\obama.jpg testdata\biden.jpg
          if ($same -lt 0.5) { throw "Same person similarity too low: $same" }
          if ($different -gt 0.25) { throw "Different people similarity too high: $different" }
        shell: pwsh

      - name: Speed benchmark
        run: |
          $out = Join-Path $PWD "bench.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--bench', '-', '5', $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Speed benchmark failed" }
        shell: pwsh

      - name: Enhancement test
        run: |
          $out = Join-Path $PWD "enhance.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--enhance-test', 'testdata\obama.jpg', 'testdata\obama2.jpg', (Join-Path $PWD "enhanced.png"), $out -Wait -PassThru
          $text = Get-Content $out -Raw
          Write-Host "exit $($p.ExitCode):`n$text"
          if ($p.ExitCode -ne 0) { throw "Enhancement test failed" }
          $fused = [double](($text | Select-String 'fused_similarity=([-\d.]+)').Matches[0].Groups[1].Value)
          if ($fused -lt 0.5) { throw "Recognition after enhancement too low: $fused" }
        shell: pwsh

      - name: Long video test
        run: |
          Invoke-WebRequest "https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples/hamilton_clip.mp4" -OutFile testdata\clip.mp4
          $out = Join-Path $PWD "video.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--video-test', 'testdata\clip.mp4', '6', $out -Wait -PassThru
          $text = Get-Content $out -Raw
          Write-Host "exit $($p.ExitCode):`n$text"
          if ($p.ExitCode -ne 0) { throw "Video test failed" }
          $frames = [int](($text | Select-String 'frames=(\d+)').Matches[0].Groups[1].Value)
          $people = [int](($text | Select-String 'people=(\d+)').Matches[0].Groups[1].Value)
          $memory = [double](($text | Select-String 'peak_memory_mb=([\d.]+)').Matches[0].Groups[1].Value)
          if ($frames -lt 2000) { throw "Video was not fully processed: $frames frames" }
          if ($people -lt 1) { throw "No people found in video" }
          if ($memory -gt 1500) { throw "Memory use too high: $memory MB" }
        shell: pwsh

      - name: Player and archive scan tests
        run: |
          $out = Join-Path $PWD "player.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--player-test', 'testdata\clip.mp4', '10', $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Player test failed" }
          # مسح الأرشيف: إيقاف في منتصف الملف ثم متابعة من الموضع المحفوظ، والتقرير الموحّد
          $out = Join-Path $PWD "archive.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--archive-test', 'testdata\clip.mp4', '1', '30', $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Archive scan test failed" }
        shell: pwsh

      - name: Large database test
        run: |
          $out = Join-Path $PWD "database.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--db-test', (Join-Path $PWD "dbtest"), '2000', '2', $out -Wait -PassThru
          $text = Get-Content $out -Raw
          Write-Host "exit $($p.ExitCode):`n$text"
          if ($p.ExitCode -ne 0) { throw "Database test failed" }
          $add = [double](($text | Select-String '(?m)^photo_add_ms=([\d.]+)').Matches[0].Groups[1].Value)
          $open = [double](($text | Select-String 'open_ms=([\d.]+)').Matches[0].Groups[1].Value)
          if ($add -gt 500) { throw "Adding a photo to a large database is too slow: $add ms" }
          if ($open -gt 3000) { throw "Opening a large database is too slow: $open ms" }
        shell: pwsh

      - name: Backup and report tests
        run: |
          $out = Join-Path $PWD "backup.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--backup-test', (Join-Path $PWD "backuptest"), $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Backup/restore test failed" }
          Invoke-WebRequest "https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples/knn_examples/test/obama_and_biden.jpg" -OutFile report_input.jpg
          $out = Join-Path $PWD "report.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--report-test', (Join-Path $PWD "report_input.jpg"), (Join-Path $PWD "report.html"), $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "HTML report test failed" }
        shell: pwsh

      - name: Camera watch test
        timeout-minutes: 3
        run: |
          # تأكيد الظهور في إطارين، وتجميع الزوار المجهولين ببصماتهم، وتسمية الزائر
          $out = Join-Path $PWD "watch.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--watch-test', (Join-Path $PWD "watchtest"), $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Camera watch test failed" }
        shell: pwsh

      - name: Camera rules and maintenance test
        timeout-minutes: 3
        run: |
          # المناطق والجداول، وتنبيه المجهول المتكرر، وحذف القديم، والنسخ الاحتياطي التلقائي، والأصوات، وتصدير المقطع
          $out = Join-Path $PWD "rules.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--rules-test', (Join-Path $PWD "rulestest"), $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Camera rules test failed" }
        shell: pwsh

      - name: Daily report test
        timeout-minutes: 3
        run: |
          # تقرير اليوم بصيغتي HTML وPDF
          $out = Join-Path $PWD "daily.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--daily-report-test', (Join-Path $PWD "dailytest"), $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Daily report test failed" }
        shell: pwsh

      - name: GPU check test
        timeout-minutes: 5
        run: |
          # فحص كرت الشاشة: المعالج يعمل دائماً، وإن وُجد كرت فنتائجه تطابق المعالج
          $out = Join-Path $PWD "gpu.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--gpu-test', 'testdata\obama.jpg', $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "GPU check test failed" }
        shell: pwsh

      - name: Recording test
        timeout-minutes: 5
        run: |
          # تسجيل الكاميرا في مجلد عربي: المدة، والموضع، والحركة فقط، ومربعات الوجوه، والحذف التلقائي
          $out = Join-Path $PWD "record.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--record-test', (Join-Path $PWD "recordtest"), $out -Wait -PassThru
          Write-Host "exit $($p.ExitCode):`n$(Get-Content $out -Raw)"
          if ($p.ExitCode -ne 0) { throw "Recording test failed" }
        shell: pwsh

      - name: Camera test
        timeout-minutes: 12
        run: |
          # صيغ عناوين الكاميرات وحفظها، ثم الفيديو يُبث بـ ffmpeg كأنه كاميرا شبكة مع انقطاع وعودة واكتشاف تلقائي
          # نسخة ffmpeg جاهزة من GitHub (choco فشل أحياناً)، والبرنامج الحقيقي لا وسيط choco الذي يبقى يبث بعد إيقافه
          $ffdir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          try {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$ffdir.zip"
            Expand-Archive "$ffdir.zip" -DestinationPath $ffdir -Force
          } catch { Write-Host "ffmpeg download failed: $_"; choco install ffmpeg -y --no-progress }
          $real = Get-ChildItem $ffdir, "$env:ChocolateyInstall\lib\ffmpeg*" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($real) { $env:PATH = "$($real.DirectoryName);$env:PATH" }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) { throw "ffmpeg not available for the live camera test" }
          Write-Host "ffmpeg: $($ffmpeg.Source)"
          $out = Join-Path $PWD "camera.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--camera-test', (Join-Path $PWD "testdata\clip.mp4"), $out -PassThru
          # مهلة للفحص نفسه، فتظهر النتائج التي كتبها حتى لحظة التعليق إن علق
          $timedOut = -not $p.WaitForExit(300000)
          if ($timedOut) { Stop-Process -Id $p.Id -Force; Get-Process ffmpeg -ErrorAction SilentlyContinue | Stop-Process -Force }
          $text = Get-Content $out -Raw
          Write-Host "exit $(if ($timedOut) { 'timeout' } else { $p.ExitCode }):`n$text"
          if ($timedOut -or $p.ExitCode -ne 0) { throw "Camera test failed" }
          if ($text -match 'live=skipped') { throw "Live camera part was skipped" }
        shell: pwsh

      - name: Smoke test
        run: |
          Add-Type @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Windows {
              delegate bool EnumProc(IntPtr hwnd, IntPtr lparam);
              [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc proc, IntPtr lparam);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int max);
              public static List<string> VisibleTitles(uint pid) {
                  var titles = new List<string>();
                  EnumWindows((hwnd, l) => {
                      uint owner; GetWindowThreadProcessId(hwnd, out owner);
                      if (owner == pid && IsWindowVisible(hwnd)) {
                          var text = new StringBuilder(512); GetWindowText(hwnd, text, 512);
                          titles.Add(text.ToString());
                      }
                      return true;
                  }, IntPtr.Zero);
                  return titles;
              }
          }
          "@
          $p = Start-Process dist\Malamih\Malamih.exe -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) { throw "Malamih exited early with code $($p.ExitCode)" }
          $titles = [Windows]::VisibleTitles([uint32]$p.Id)
          Write-Host "Visible windows: $($titles -join ' | ')"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $shot.Save((Join-Path $PWD "smoke.png"))
          Stop-Process -Id $p.Id
          if ($titles -notcontains "ملامح") { throw "Main window not found" }
        shell: pwsh

      - name: Worst-conditions recognition test
        if: github.event_name == 'workflow_dispatch' && inputs.worst_conditions
        run: |
          $base = "https://raw.githubusercontent.com/ageitgey/face_recognition/master"
          $files = @{
            'enroll\obama\obama.jpg'       = 'examples/obama.jpg'
            'enroll\biden\biden.jpg'       = 'examples/knn_examples/train/biden/biden.jpg'
            'enroll\kit\john1.jpeg'        = 'examples/knn_examples/train/kit_harington/john1.jpeg'
            'enroll\rose\img1.jpg'         = 'examples/knn_examples/train/rose_leslie/img1.jpg'
            'enroll\alex\img1.jpg'         = 'examples/knn_examples/train/alex_lacamoire/img1.jpg'
            'probe\obama__2.jpg'           = 'examples/obama2.jpg'
            'probe\obama__3.jpg'           = 'tests/test_images/obama3.jpg'
            'probe\biden__2.jpg'           = 'examples/knn_examples/train/biden/biden2.jpg'
            'probe\kit__test.jpg'          = 'examples/knn_examples/test/johnsnow_test1.jpg'
            'probe\rose__2.jpg'            = 'examples/knn_examples/train/rose_leslie/img2.jpg'
            'probe\alex__png.png'          = 'examples/alex-lacamoire.png'
            'probe\obama+biden__pair.jpg'  = 'examples/knn_examples/test/obama_and_biden.jpg'
            'probe\kit+rose__pair.jpg'     = 'examples/knn_examples/test/kit_with_rose.jpg'
            'probe\unknown__lin.png'       = 'examples/lin-manuel-miranda.png'
          }
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path "stress" $entry.Key
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Invoke-WebRequest "$base/$($entry.Value)" -OutFile $target
          }
          $out = Join-Path $PWD "stress.txt"
          $p = Start-Process dist\Malamih\Malamih.exe -ArgumentList '--stress-test', 'stress\enroll', 'stress\probe', $out -Wait -PassThru
          $text = Get-Content $out -Raw
          Write-Host "exit $($p.ExitCode):`n$text"
          $wrong = [int](($text | Select-String 'total_wrong=(\d+)').Matches[0].Groups[1].Value)
          $recall = [double](($text | Select-String 'recall=([\d.]+)').Matches[0].Groups[1].Value)
          if ($wrong -gt 0) { throw "Wrong matches under bad conditions: $wrong" }
          if ($recall -lt 0.95) { throw "Recognition under bad conditions dropped: $recall" }
        shell: pwsh

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\Malamih" installer\malamih.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item dist\Malamih-Setup.exe
        shell: pwsh

      - name: Installer test
        run: |
          $dir = Join-Path $PWD "installed"
          $p = Start-Process dist\Malamih-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", '/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with code $($p.ExitCode)" }
          $out = Join-Path $PWD "installed.txt"
          $p = Start-Process "$dir\Malamih.exe" -ArgumentList '--self-test', 'testdata\obama.jpg', 'testdata\obama2.jpg', $out -Wait -PassThru
          Write-Host (Get-Content $out -Raw)
          if ($p.ExitCode -ne 0) { throw "Installed app failed its self-test" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed with code $($p.ExitCode)" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Malamih-windows-x64
          path: dist/Malamih

      - uses: actions/upload-artifact@v4
        with:
          name: Malamih-Setup
          path: dist/Malamih-Setup.exe
