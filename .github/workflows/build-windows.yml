name: Build Windows

on:
  push:
  workflow_dispatch:

env:
  OPENCV_VERSION: '4.10.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-${{ env.OPENCV_VERSION }}-windows

      - name: Install OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe"
          Invoke-WebRequest $url -OutFile opencv.exe
          Start-Process .\opencv.exe -ArgumentList '-oC:\opencv', '-y' -Wait
          Get-ChildItem C:\opencv\opencv\build\x64
        shell: pwsh

      - name: Cache models and ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEPS_DIR="${{ github.workspace }}/.deps-cache" -DOpenCV_DIR=C:/opencv/opencv/build/x64/vc16/lib

      - name: Build
        run: cmake --build build

      - name: Deploy
        run: |
          New-Item -ItemType Directory dist\HelloQt | Out-Null
          Copy-Item build\HelloQt.exe, build\*.dll dist\HelloQt\
          Copy-Item build\models dist\HelloQt\models -Recurse
          windeployqt --release --no-translations dist\HelloQt\HelloQt.exe
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "MSVC runtime not found under $env:VCToolsRedistDir" }
          Copy-Item "$($crt.FullName)\*.dll" dist\HelloQt\
          Get-ChildItem dist\HelloQt
        shell: pwsh

      - name: Recognition test
        run: |
          $base = "https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples"
          New-Item -ItemType Directory testdata | Out-Null
          foreach ($name in 'obama.jpg', 'obama2.jpg', 'biden.jpg') { Invoke-WebRequest "$base/$name" -OutFile "testdata\$name" }

          function Compare-Faces($first, $second) {
            $out = Join-Path $PWD "result.txt"
            $p = Start-Process dist\HelloQt\HelloQt.exe -ArgumentList '--self-test', $first, $second, $out -Wait -PassThru
            $text = Get-Content $out -Raw
            Write-Host "$first vs $second (exit $($p.ExitCode)):`n$text"
            if ($p.ExitCode -ne 0) { throw "Self-test failed" }
            return [double](($text | Select-String 'best_similarity=([-\d.]+)').Matches[0].Groups[1].Value)
          }

          $same = Compare-Faces testdata\obama.jpg testdata\obama2.jpg
          $different = Compare-Faces testdata\obama.jpg testdata\biden.jpg
          if ($same -lt 0.5) { throw "Same person similarity too low: $same" }
          if ($different -gt 0.25) { throw "Different people similarity too high: $different" }
        shell: pwsh

      - name: Smoke test
        run: |
          $p = Start-Process dist\HelloQt\HelloQt.exe -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "HelloQt exited early with code $($p.ExitCode)" }
          $title = $p.MainWindowTitle
          Write-Host "Window title: $title"
          Stop-Process -Id $p.Id
          if ($title -ne "التعرف على الوجوه") { throw "Unexpected window title: '$title'" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: HelloQt-windows-x64
          path: dist/HelloQt
